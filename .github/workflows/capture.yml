name: Atualizar Snapshot da Webcam

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg, jq e Fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq curl fonts-dejavu-core

      - name: Obter Temperatura da Estacao
        run: |
          API_URL="https://api.weather.com/v2/pws/observations/current?stationId=${{ secrets.WU_STATION_ID }}&format=json&units=m&apiKey=${{ secrets.WU_API_KEY }}"
          RAW_TEMP=$(curl -s "$API_URL" | jq -r '.observations[0].metric.temp')
          
          if [ -z "$RAW_TEMP" ] || [ "$RAW_TEMP" = "null" ]; then
            echo "CURRENT_TEMP=--.-" >> $GITHUB_ENV
          else
            FORMATTED_TEMP=$(printf "%.1f" "$RAW_TEMP" 2>/dev/null || echo "$RAW_TEMP")
            echo "CURRENT_TEMP=${FORMATTED_TEMP}" >> $GITHUB_ENV
          fi

      - name: Capturar Frame e Estampar Temperatura
        run: |
          ffmpeg -y -rtsp_transport tcp -i "${{ secrets.RTSP_URL }}" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='${CURRENT_TEMP}°C':x=30:y=85:fontsize=42:fontcolor=white:borderw=2:bordercolor=black:box=0" \
            -frames:v 1 -q:v 2 snapshot.jpg

      - name: Forçar Atualização no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .last_update
          git add snapshot.jpg .last_update
          git commit -m "Auto snapshot: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
