name: Atualizar Snapshot da Webcam

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq curl fonts-dejavu-core python3

      - name: Obter Temperatura da Estacao
        run: |
          API_URL="https://api.weather.com/v2/pws/observations/current?stationId=${{ secrets.WU_STATION_ID }}&format=json&units=e&apiKey=${{ secrets.WU_API_KEY }}"
          
          RAW_F=$(curl -s --max-time 15 "$API_URL" | jq -r '.observations[0].imperial.temp // empty')
          
          if [ -z "$RAW_F" ] || [ "$RAW_F" = "null" ]; then
            echo "CURRENT_TEMP=--.-" >> $GITHUB_ENV
          else
            TEMP_C=$(python3 -c "f = float('$RAW_F'); print(f'{(f - 32.0) * 5.0 / 9.0:.1f}')" 2>/dev/null || echo "--.-")
            echo "CURRENT_TEMP=${TEMP_C}" >> $GITHUB_ENV
          fi

      - name: Capturar Frame e Estampar Temperatura
        run: |
          timeout 20s ffmpeg -y -rtsp_transport tcp -timeout 5000000 -i "${{ secrets.RTSP_URL }}" \
            -analyzeduration 1000000 -probesize 1000000 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='|  ${CURRENT_TEMP}°C':x=670:y=42:fontsize=36:fontcolor=white:borderw=2:bordercolor=black:box=0" \
            -frames:v 1 -q:v 2 snapshot.jpg

      - name: Forçar Atualização no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .last_update
          git add snapshot.jpg .last_update
          git commit -m "Auto snapshot: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
