name: Atualizar Snapshot da Webcam

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Capturar Frame da Camara
        run: |
          ffmpeg -y -rtsp_transport tcp -i "${{ secrets.RTSP_URL }}" -frames:v 1 -q:v 2 snapshot.jpg

      - name: Atualizar imagem no repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.jpg
          git commit -m "Auto snapshot [skip ci]" || exit 0
          git push
